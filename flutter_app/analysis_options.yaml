include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # This codebase deliberately uses concatenation over interpolation so the
    # Figma-derived label strings stay readable; the lint fires ~30 times.
    prefer_interpolation_to_compose_strings: false

analyzer:
  errors:
    prefer_const_constructors: ignore
    use_build_context_synchronously: ignore

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter_app

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Drop superseded sources
        run: |
          rm -rf lib/data test
          rm -f lib/models/activity_item.dart \
                lib/models/chat_message.dart \
                lib/models/person.dart \
                lib/screens/app_drawer.dart \
                lib/screens/intro_screen.dart \
                lib/screens/onboarding/step_scaffold.dart \
                lib/services/api.dart \
                lib/services/local_api.dart \
                lib/services/store.dart \
                lib/widgets/app_header.dart \
                lib/widgets/buttons.dart \
                lib/widgets/icons.dart \
                lib/widgets/mode_switch.dart \
                lib/widgets/photo_circle.dart \
                lib/widgets/range_row.dart \
                lib/widgets/wave.dart

      - name: Regenerate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.glances --project-name glances .

      - name: Apply app permissions and name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()

          perms = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          )
          if 'ACCESS_FINE_LOCATION' not in xml:
              head, sep, tail = xml.partition('>')
              xml = head + sep + '\n' + perms + tail

          xml = xml.replace('android:label="glances"', 'android:label="Glances"')
          manifest.write_text(xml)
          print(xml)
          PY

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glances-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
